[project]
name = 'bigview-project'
description = 'DeFi Treasury and Staking Protocol'
authors = ['Henry Goodluck Chigozie']
telemetry = true
cache_dir = './.clarinet'

# REMOVE the sip-010 requirement here because you have it as a local contract now!
# REMOVE the pox-4 requirement here if you are using your local pox-trait for testing.

[contracts.sip-010-trait]
path = "contracts/sip-010-trait.clar"
clarity_version = 2
epoch = '2.5'

[contracts.pox-trait]
path = "contracts/pox-trait.clar"
clarity_version = 2
epoch = '2.5'

[contracts.bigview-token]
path = 'contracts/bigview-token.clar'
clarity_version = 2
epoch = '2.5'

[contracts.bigview-treasury-v8]
path = 'contracts/bigview-treasury-v8.clar'
clarity_version = 2
epoch = '2.5'

[repl.analysis.lint_groups]

[repl.analysis.lints]

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false

[repl.remote_data]
enabled = false
api_url = 'https://api.hiro.so'
