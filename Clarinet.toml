[project]
name = 'bigview-project'
description = 'DeFi Treasury and Staking Protocol'
authors = ['Henry Goodluck Chigozie']
telemetry = true
cache_dir = './.clarinet'

# 1. The Traits (No dependencies)
[contracts.sip-010-trait-v2]
path = 'contracts/sip-010-trait.clar'
clarity_version = 2
epoch = '2.5'

[contracts.pox-trait-v2]
path = 'contracts/pox-trait-v2.clar'
clarity_version = 2
epoch = '2.5'

# 2. Your Token (Depends on the SIP-010 trait)
[contracts.bigview-token]
path = 'contracts/bigview-token.clar'
clarity_version = 2
epoch = '2.5'
depends_on = ['sip-010-trait']

# 3. The Treasury (Depends on everything)
[contracts.bigview-treasury-v7]
path = 'contracts/bigview-treasury-v7.clar'
clarity_version = 2
epoch = '2.5'
depends_on = ['sip-010-trait-v2', 'pox-trait-v2', 'bigview-token']

[repl.analysis]
passes = ['call_checker', 'check_checker']